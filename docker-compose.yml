services:
  postgres:
    image: postgres:16-alpine
    container_name: idms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: idms
    ports:
      - "5432:5432"
    volumes:
      - idms_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: idms_mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

volumes:
  idms_pgdata:
