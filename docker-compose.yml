services:
  postgres:
    image: postgres:16-alpine
    container_name: idms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: idms
    ports:
      - "5432:5432"
    volumes:
      - idms_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: idms_mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idms_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/idms
      - AUTH_SECRET=production_auth_secret_must_be_at_least_32_characters_long_jmdcart
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  idms_pgdata:
