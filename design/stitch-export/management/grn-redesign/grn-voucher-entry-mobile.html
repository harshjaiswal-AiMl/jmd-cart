<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purchase Voucher Entry (GRN) - Mobile Fallback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-primary: #f8fafc;
      --border: #e2e8f0;
      --text-main: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-main); font-size: 13px; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #0f172a; color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; margin: 12px; padding: 12px; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
    .input-group input, .input-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .line-item { background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .footer { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--border); padding: 12px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-weight:700; font-size:14px;">Purchase GRN (Mobile)</div>
    <div style="font-size:11px; color:#94a3b8;">14-11-2026</div>
  </div>
  <div class="card">
    <div class="input-group">
      <label>Supplier / Brand</label>
      <input type="text" placeholder="Select supplier..." />
    </div>
    <div style="display:flex; gap:8px;">
      <div class="input-group" style="flex:1;">
        <label>Bill No</label>
        <input type="text" placeholder="INV-9921" />
      </div>
      <div class="input-group" style="flex:1;">
        <label>Bill Date</label>
        <input type="date" value="2026-11-14" />
      </div>
    </div>
  </div>
  <div class="card" style="flex:1;">
    <div style="font-weight:700; margin-bottom:8px; font-size:12px; text-transform:uppercase; color:#475569;">Received Items</div>
    <div class="line-item">
      <div style="font-weight:700;">Bikaji Bhujia 400g</div>
      <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:12px;">
        <span>Qty: <strong>10 Carton</strong></span>
        <span>Rate: <strong>₹1,850</strong></span>
        <span style="font-weight:700; color:#2563eb;">₹19,425</span>
      </div>
    </div>
    <button style="width:100%; padding:8px; background:#eff6ff; color:#2563eb; border:1px dashed #93c5fd; border-radius:6px; font-weight:700; font-size:12px; margin-top:8px;">
      + Add Another Item
    </button>
  </div>
  <div class="footer">
    <div>
      <div style="font-size:10px; color:#64748b;">Total Payable</div>
      <div style="font-size:18px; font-weight:900; color:#0f172a; font-family:monospace;">₹19,425.00</div>
    </div>
    <button style="background:#16a34a; color:#fff; border:none; padding:10px 18px; font-weight:800; border-radius:6px;">
      Post Receipt
    </button>
  </div>
</body>
</html>
