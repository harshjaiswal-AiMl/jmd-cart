<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purchase Voucher Entry (GRN) - 1024x768 Tablet</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --header-bg: #0f172a;
      --accent: #2563eb;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-main); font-size: 12px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .command-header { background: var(--header-bg); color: #fff; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; height: 46px; }
    .meta-bar { background: #fff; border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .voucher-grid-wrapper { flex: 1; overflow-y: auto; background: #fff; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f1f5f9; position: sticky; top: 0; padding: 6px 8px; font-size: 11px; text-transform: uppercase; color: #475569; border-bottom: 2px solid #cbd5e1; }
    td { padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 11px; }
    .status-line { background: #f8fafc; border-top: 1px solid var(--border); padding: 6px 12px; font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; height: 30px; align-items: center; }
    .action-summary-bar { background: #fff; border-top: 2px solid #cbd5e1; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; height: 68px; }
    .footer-hotkeys { background: #0f172a; color: #94a3b8; font-size: 10px; padding: 6px 12px; display: flex; gap: 8px; height: 28px; align-items: center; overflow-x: auto; }
    .hotkey { color: #38bdf8; font-weight: 700; font-family: monospace; }
  </style>
</head>
<body>
  <div class="command-header">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="background:#2563eb; color:#fff; font-weight:900; font-family:monospace; padding:2px 6px; border-radius:4px; font-size:10px;">GRN</span>
      <span style="font-weight:700; font-size:13px;">Purchase Voucher Entry</span>
    </div>
    <div style="font-size:11px; color:#94a3b8;">Main Godown &bull; 14-11-2026</div>
  </div>
  <div class="meta-bar">
    <div style="flex:1; min-width: 200px;">
      <label style="font-size:9px; font-weight:700; text-transform:uppercase; color:#64748b; display:block;">Supplier / Brand [Alt+S]</label>
      <input type="text" placeholder="Search supplier or brand..." style="width:100%; padding:4px 6px; border:1px solid #cbd5e1; border-radius:4px; font-size:11px;" />
    </div>
    <div style="width:140px;">
      <label style="font-size:9px; font-weight:700; text-transform:uppercase; color:#64748b; display:block;">Supplier Bill No.</label>
      <input type="text" placeholder="INV-9921" style="width:100%; padding:4px 6px; border:1px solid #cbd5e1; border-radius:4px; font-size:11px;" />
    </div>
    <div style="width:110px;">
      <label style="font-size:9px; font-weight:700; text-transform:uppercase; color:#64748b; display:block;">Bill Date</label>
      <input type="date" value="2026-11-14" style="width:100%; padding:4px 6px; border:1px solid #cbd5e1; border-radius:4px; font-size:11px;" />
    </div>
  </div>
  <div class="voucher-grid-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width:30px; text-align:center;">#</th>
          <th>Item Description</th>
          <th style="width:60px; text-align:center;">Qty</th>
          <th style="width:70px; text-align:center;">Unit</th>
          <th style="width:90px; text-align:right;">Rate (₹)</th>
          <th style="width:60px; text-align:center;">GST</th>
          <th style="width:100px; text-align:right;">Amount (₹)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="text-align:center; color:#64748b;">1</td>
          <td><strong>Bikaji Bhujia 400g</strong></td>
          <td style="text-align:center; font-weight:700;">10</td>
          <td style="text-align:center;">Carton</td>
          <td style="text-align:right; font-family:monospace;">1,850.00</td>
          <td style="text-align:center;">5%</td>
          <td style="text-align:right; font-family:monospace; font-weight:700;">19,425.00</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="status-line">
    <div>Stock: <strong>Shop: 12 &bull; Godown: 48</strong> | MRP: <strong>₹120.00</strong></div>
    <div><span class="hotkey">[F8]</span> Info</div>
  </div>
  <div class="action-summary-bar">
    <div style="display:flex; gap:8px;">
      <button style="background:#16a34a; color:#fff; border:none; padding:8px 14px; font-weight:800; font-size:13px; border-radius:4px; cursor:pointer;">
        Confirm [F2]
      </button>
      <button style="background:#fff; border:1px solid #ef4444; color:#ef4444; padding:6px 10px; font-weight:700; border-radius:4px; cursor:pointer;">
        Cancel [Esc]
      </button>
    </div>
    <div style="text-align:right;">
      <div style="font-size:18px; font-weight:900; color:#0f172a; font-family:monospace;">₹19,425.00</div>
    </div>
  </div>
  <div class="footer-hotkeys">
    <span><span class="hotkey">[F2]</span> Post</span>
    <span><span class="hotkey">[F3]</span> New</span>
    <span><span class="hotkey">[F4]</span> Hold</span>
    <span><span class="hotkey">[F6]</span> Add</span>
    <span><span class="hotkey">[F8]</span> Info</span>
    <span><span class="hotkey">[F9]</span> Del</span>
    <span><span class="hotkey">[Alt+S]</span> Sup</span>
    <span><span class="hotkey">[?]</span> Help</span>
  </div>
</body>
</html>
