<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="360" rx="18" fill="url(#bgGrad)" />
  
  <!-- Decorative Ring -->
  <circle cx="200" cy="160" r="80" fill="#FFFFFF" fill-opacity="0.12" />
  <circle cx="200" cy="160" r="64" fill="#FFFFFF" fill-opacity="0.18" />
  
  <!-- Icon Emoji -->
  <text x="200" y="175" font-size="52" text-anchor="middle" dominant-baseline="middle">🔋</text>
  
  <!-- Brand Display Name -->
  <text x="200" y="270" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    EVEREADY
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="200" y="305" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#FEF2F2" text-anchor="middle" letter-spacing="0.5">
    Give Me Red - Batteries & Lights
  </text>
  
  <!-- Trust Badge -->
  <rect x="110" y="330" width="180" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.2" />
  <text x="200" y="346" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">
    100% GENUINE • JMD CART
  </text>
</svg>