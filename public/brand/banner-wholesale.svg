<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#914d00" />
      <stop offset="50%" stop-color="#6d3900" />
      <stop offset="100%" stop-color="#381c00" />
    </linearGradient>
    <linearGradient id="whiteGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad2)" />

  <!-- Decorative circles -->
  <circle cx="1060" cy="190" r="190" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="980" cy="130" r="110" fill="#fef3c7" fill-opacity="0.06" />

  <!-- Content Left -->
  <g transform="translate(60, 60)">
    <!-- Badge -->
    <rect x="0" y="0" width="270" height="32" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="135" y="21" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ LIVE MANDI SLAB RATES</text>

    <!-- Main Headline -->
    <text x="0" y="85" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5">Wholesale Mandi Price Slabs</text>

    <!-- Subtitle -->
    <text x="0" y="125" fill="#ffffff" fill-opacity="0.88" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Fortune Oil ₹144 • Aashirvaad Atta ₹418 • India Gate Basmati ₹118</text>

    <!-- Offer Pill -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="220" height="52" rx="12" fill="url(#whiteGrad2)" filter="url(#shadow2)" />
      <text x="110" y="32" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" text-anchor="middle">VIEW WHOLESALE →</text>
    </g>

    <text x="250" y="192" fill="#ffffff" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Volume Discounts on Master Cartons</text>
  </g>

  <!-- Right Visual Graphics: Wholesale Tier Tag -->
  <g transform="translate(860, 60)" filter="url(#shadow2)">
    <rect x="0" y="0" width="260" height="260" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18" />
    <circle cx="130" cy="110" r="70" fill="#ffffff" fill-opacity="0.95" />
    <text x="130" y="122" font-size="64" text-anchor="middle">🏷️</text>
    <rect x="30" y="200" width="200" height="36" rx="8" fill="#ffffff" />
    <text x="130" y="224" fill="#914d00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">TIER A/B/C PRICING</text>
  </g>
</svg>
